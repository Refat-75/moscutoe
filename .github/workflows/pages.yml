name: Build and deploy MosCutoe (C++ backend)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile the C++ backend
        run: g++ -std=c++17 -O2 cpp-backend/main.cpp -o moscutoe
      - name: Run C++ backend (database.txt -> data.js, answer pages, sitemap)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          REPO="${{ github.event.repository.name }}"
          if [ "$(echo "$REPO" | tr 'A-Z' 'a-z')" = "$OWNER.github.io" ]; then
            URL="https://$OWNER.github.io"
          else
            URL="https://$OWNER.github.io/$REPO"
          fi
          echo "Site URL: $URL"
          ./moscutoe build "$URL"
      - name: Collect site files
        run: |
          mkdir _site
          for f in index.html answers.html 404.html style.css app.js data.js sw.js manifest.webmanifest robots.txt sitemap.xml; do
            [ -f "$f" ] && cp "$f" _site/ || echo "missing file: $f"
          done
          for d in img answer video; do
            [ -d "$d" ] && cp -r "$d" _site/ || echo "missing folder: $d"
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
